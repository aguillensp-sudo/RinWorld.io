name: CI

on:
  push:
    branches: [main, 'mvp/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # El esquema se prueba contra un Postgres real, sin tocar el proyecto remoto.
  # Es el mismo runner que se usa en local: supabase/tests/run.sh.
  schema:
    # El nombre llevaba "(41 asertos)" y el 11-ago ya eran más — 0011 añadió dos.
    # Una cifra dentro de un nombre es un dato que hay que recomputar a mano cada
    # vez que alguien añade un aserto, y nadie lo hace: el número dejó de casar
    # sin que nada fallara, que es la forma más barata de que un rótulo mienta.
    # El recuento real lo dice el propio runner al ejecutarse.
    name: Esquema (smoke + catálogo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test del esquema
        run: bash supabase/tests/run.sh

  app:
    name: App · typecheck, Vitest, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Cobertura de tokens
        # Si el sistema de diseño se queda corto, el Coder no tiene mas salida que
        # escribir un hex, y C3 falla por un hueco nuestro y no por fallo suyo.
        run: npm run check:palette
      - name: Vitest
        # `npm test` a secas, y es la suite ENTERA. El que recorta es el arnes
        # (`npm run test:arnes`, F-116 / B-011), no el producto: aqui tienen que
        # correr tambien los `*.fuera-de-contrato.test.*`.
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  e2e:
    name: Playwright · puerta de las dos cuentas
    runs-on: ubuntu-latest
    needs: app
    # Entregable 1 de Fundación V1 (entornos como código): este job corre
    # contra el proyecto Supabase aislado (`bearingworld-e2e`), no contra
    # producción -- ver openspec/v1/entornos.md.
    environment: staging
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test
        env:
          CI: 'true'
          # Entregable 3 de Fundación V1 (F-149): proyecto AISLADO de
          # producción/demo, no `secrets.SUPABASE_URL`. Cierra la causa raíz
          # de F-149 -- esta suite ya no puede resetear datos compartidos
          # mientras una prueba manual sigue en curso contra el otro proyecto,
          # porque ya no toca ese proyecto en absoluto.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_E2E_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_E2E_PUBLISHABLE_KEY }}
          # Sin estas, e2e/session.spec.ts lanza un error en CI en vez de
          # saltarse la puerta: un skip silencioso reportaría verde sin haber
          # probado lo único que el día 2 tenía que demostrar. Mismas cuentas
          # por email/password que el proyecto principal -- Supabase Auth es
          # por proyecto, sin colisión -- así que estos tres secretos NO
          # cambian con el aislamiento.
          E2E_ALPHA_EMAIL: ${{ secrets.E2E_ALPHA_EMAIL }}
          E2E_ALPHA_PASSWORD: ${{ secrets.E2E_ALPHA_PASSWORD }}
          E2E_ALPHA_ORG: ${{ secrets.E2E_ALPHA_ORG }}
          E2E_BETA_EMAIL: ${{ secrets.E2E_BETA_EMAIL }}
          E2E_BETA_PASSWORD: ${{ secrets.E2E_BETA_PASSWORD }}
          E2E_BETA_ORG: ${{ secrets.E2E_BETA_ORG }}
          # F-071 · las dos que faltaban, y sin las cuales el secret que se le
          # pidió al PO no habría servido de nada.
          #
          # `canResetFixture` (e2e/fixtures.ts:40-42) exige LAS TRES:
          # VITE_SUPABASE_URL, SUPABASE_SERVICE_KEY y VITE_DEMO_KEY_SEED. Aquí
          # solo llegaba la primera, así que el reseteo de fixture y el test de
          # envío cifrado se saltaban en CI — y seguirían saltándose después de
          # añadir el secret, porque el workflow no lo leía.
          #
          # `VITE_DEMO_KEY_SEED` hace falta además por otra vía: `webServer`
          # (playwright.config.ts:58) construye la app con `npm run build`
          # dentro de este job. Sin la semilla, la app deriva claves aleatorias
          # y no puede descifrar lo sembrado, aunque el fixture sí corriera.
          #
          # Nombres de secret sin el prefijo `VITE_`, como SUPABASE_URL.
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_E2E_SERVICE_KEY }}
          VITE_DEMO_KEY_SEED: ${{ secrets.DEMO_KEY_SEED }}
      # DECISIÓN DEL PO, 12-ago: se queda como está — opción (a) de las tres que
      # había sobre la mesa. Yo recomendaba la (b), subirlo solo al fallar; el PO
      # eligió dejarlo, y queda anotado aquí para que nadie lo "arregle" sin saber
      # que ya se decidió.
      #
      # El contexto, porque importa: este informe es el que llegó a adjuntar un
      # volcado del DOM con la contraseña de alpha. Ya no se escribe, y los 7 días
      # de retención acotan lo que quede. Si algún día vuelve a colarse un
      # secreto en el DOM, esta línea es la que hay que revisar primero.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # El arnés, que llevaba fuera de aquí desde que existe.
  #
  # La CI corría esquema, app y Playwright, y `harness/tests/test_checks.py` no.
  # Por eso `test_c2_paths` estuvo DIECISÉIS DÍAS en rojo fijo sin que saltara
  # nada: la única forma de enterarse era que alguien lo lanzara a mano, y nadie
  # lo lanza cuando no está tocando el arnés.
  #
  # Es el mismo patrón que persigue el arnés entero —un veredicto que nadie mira
  # no es un veredicto—, cometido con el arnés mismo.
  #
  # ⚠ Corre en Linux y el arnés se desarrolla en Windows, y eso es una
  # característica, no un problema: `resolve()` existe porque en Windows `npm` es
  # `npm.CMD`, y `_pid_vivo()` tiene dos ramas porque `os.kill(pid, 0)` en
  # Windows MATA el proceso. Las dos ramas se escribieron mirando solo una. Aquí
  # se ejecuta la otra.
  arnes:
    name: Arnés · piezas puras (sin red, sin coste)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Sin `npm ci`: `test_toolchain` solo necesita que `npm` y `npx` existan y
      # arranquen. Instalar las dependencias de la app aquí sería pagar dos
      # minutos por una comprobación que no las mira.
      - name: Dependencias del arnés
        run: pip install -r harness/requirements.txt
      - name: Piezas puras
        # Ni red ni coste: no hay clave del modelo en este job A PROPÓSITO. Si
        # alguna prueba empieza a necesitarla, es que ha dejado de ser pura.
        run: python -m harness.tests.test_checks

  # ---------------------------------------------------------------------------
  # Entregable 2 de Fundación V1 (despliegue continuo). Hasta el 6-sep-2026 el
  # despliegue era manual y en dos sistemas aparte -- F-072 y F-091 documentan
  # que eso ya produjo un despliegue roto y un "cerrado" falso en el relevo,
  # porque un commit fusionado no implicaba que hubiera llegado a la URL real.
  #
  # Las migraciones de esquema NO se tocan aquí a propósito: siguen aplicándose
  # a mano por el MCP de Supabase, revisadas una a una. Automatizar `db push`
  # en cada fusión es un riesgo mayor que el que F-091/F-072 describen, y
  # ninguno de los dos lo pide.
  deploy:
    name: Despliegue continuo · app + VERA
    runs-on: ubuntu-latest
    needs: [schema, app, e2e, arnes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/mvp/bootstrap'
    # Entregable 1 de Fundación V1 (entornos como código) -- ver
    # openspec/v1/entornos.md. `staging` (el job `e2e`) tiene su propio proyecto
    # Supabase aislado desde el entregable 3 (F-149); este job es `production`.
    environment: production
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: VERA a Supabase (Edge Function)
        # Va PRIMERO a propósito (7-sep): el paso de Vercel está bloqueado por
        # F-151 (acceso de cuenta, no de configuración -- ver el hallazgo) y
        # un paso que falla para el job entero por defecto. Con este orden,
        # el despliegue de VERA se puede verificar de forma independiente
        # mientras F-151 sigue abierto, en vez de quedar sin probar nunca.
        #
        # `SUPABASE_ACCESS_TOKEN` (env var, nombre que exige la CLI) sale del
        # secreto `SUPABASE_TOKEN` -- así se llamó al crearlo (7-sep), GitHub
        # no deja renombrar secretos. Token nuevo, scopeado para CI -- no pasa
        # por el login local de la CLI, que sigue en la cuenta equivocada
        # (F-073). Por eso este paso no hereda ese bloqueo.
        run: npx supabase functions deploy vera --project-ref troxminloxkjwihwfevs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
      - name: App a Vercel (producción)
        # F-151 (8-sep): la cuenta de Vercel vieja no administraba el equipo
        # dueño del proyecto -- cuatro tokens distintos fallaron con "User
        # not found" antes de llegar siquiera a mirar el proyecto. Cuenta
        # nueva (personal, `alvaro-7494`), proyecto nuevo creado por
        # `vercel link` (no por "Import Git Repository": esa vía conecta un
        # disparador propio de Vercel por push que habría duplicado este
        # mismo despliegue y saltado la puerta de tests de este job).
        #
        # `app/.vercel/project.json` no se comitea (está en `.gitignore`,
        # es estado local de quien enlaza) y este runner parte de un
        # checkout limpio, así que el enlace va por las env vars que la
        # propia CLI de Vercel documenta como alternativa a `vercel link`:
        # VERCEL_ORG_ID y VERCEL_PROJECT_ID. Sin `--scope`: con esas dos
        # puestas la CLI no lo necesita. Los dos IDs no son secretos --son
        # identificadores, no credenciales-- así que van literales, igual
        # que antes iba `team_...` literal en `--scope`.
        #
        # ⚠ Sin confirmar en una corrida real todavía (regla 2 de
        # ESTADO-V1.md): esto quita la causa que F-151 documentó, pero no se
        # declara resuelto hasta verlo verde en `gh run view`.
        run: npx vercel --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_NEWACCOUNT_TOKEN }}
          VERCEL_ORG_ID: team_R5unqkZcbV5BDvmyQsS9t64x
          VERCEL_PROJECT_ID: prj_ybo4kVtQJcL0ZbhrI3qhzIVe5GUP
