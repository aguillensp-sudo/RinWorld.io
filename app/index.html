<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Despliegue de demo: no indexar (`openspec/mvp/despliegue.md`). La cabecera
       `X-Robots-Tag` de vercel.json dice lo mismo; esta etiqueta lo repite porque
       sobrevive a un cambio de hosting, donde vercel.json no significa nada. -->
  <meta name="robots" content="noindex, nofollow">
  <title>Bearingworld.io</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <!-- Las tres familias del sistema de diseño (§1.2) y los iconos del shell
       aprobado. Mismas fuentes que Rinworld_app_shell.html. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <!--
    VERSIÓN FIJA, NO `@latest` (despliegue.md §7.1). Con `@latest` la fuente de
    iconos puede cambiar sola entre dos cargas de la misma página: nadie toca el
    repo, nadie despliega, y el shell aparece con los iconos rotos. Tres días
    antes de enseñarle la plataforma a un socio eso no es un riesgo aceptable.

    3.46.0 es lo que `@latest` resolvía el 17-ago, y se ha comprobado que el CSS
    servido por las dos URL es EL MISMO fichero: sha256
    40d8d8fdbd0dc3401cecfc069065e20268a38f58662ef64d648c7905d5033deb, 211022
    bytes. O sea que fijarlo no cambia nada hoy — solo impide que cambie mañana.
  -->
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css" rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
